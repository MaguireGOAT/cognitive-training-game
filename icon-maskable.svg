<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Cognitive training app brain emoji icon</title>
  <desc id="desc">Brain emoji centered on a full square cream background.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#3d2c1e" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1024" height="1024" fill="#f5f0e8"/>

  <text
    x="512"
    y="461"
    text-anchor="middle"
    dominant-baseline="central"
    font-family="'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji','Twemoji Mozilla',sans-serif"
    font-size="640"
    filter="url(#shadow)">
    🧠
  </text>
</svg>
